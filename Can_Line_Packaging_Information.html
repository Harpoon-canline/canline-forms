<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Can Line Packaging Information</title>
<style>
  :root {
    --bg: #0b1e30;
    --card: #204667;
    --accent: #9e1a41;
    --text: #ffffff;
    --muted: #b9c7d4;
    --warn: #ffcf5c;
    --eff-good: #22e67a;
    --eff-caution: #ffb020;
    --eff-bad: #ff5252;
    --live: #9e1a41;
  }
  * { box-sizing: border-box; }
  /* 2026-11-03: size everything off the screen width. 1920-wide = 16px (same as before);
     a 4K TV = 32px, so the board fills a big screen instead of shrinking into the middle. */
  html { font-size: max(16px, calc(100vw / 120)); }
  html, body {
    overscroll-behavior: none;
    height: 100%;
    overflow: hidden;
  }
  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 1.5rem;
    font-size: 1.125rem;
    -webkit-user-select: none;
    user-select: none;
    cursor: none;
    display: flex;
    flex-direction: column;
  }
  /* The TV has no one to scroll it, so the board is split into PAGES that rotate
     on a timer. #stage fills whatever height is left under the header; every page
     sits stacked in it and only the active one is visible (cross-fade). buildPages()
     (below) packs cards onto pages by measuring real rendered height, so it adapts
     to any screen size and to cards being added/removed through the day. */
  header { text-align: center; margin-bottom: 12px; flex-shrink: 0; }
  #status, #errorBanner { flex-shrink: 0; }
  #stage { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; }
  .page {
    position: absolute;
    top: 0; left: 0; right: 0;
    max-width: 106rem;
    margin: 0 auto;
    transform-origin: top center;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.6s ease, visibility 0s linear 0.6s;
  }
  .page.active {
    opacity: 1;
    visibility: visible;
    transition: opacity 0.6s ease;
  }
  .section-title .page-count { font-weight: 600; color: var(--muted); font-size: 1.3rem; margin-left: 10px; }
  #pager {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    height: 30px;
    margin-top: 10px;
  }
  #pager .dots { display: flex; gap: 10px; }
  #pager .dot { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,0.22); transition: background 0.3s ease, transform 0.3s ease; }
  #pager .dot.active { background: var(--text); transform: scale(1.25); }
  #pager .page-label { font-size: 1rem; color: var(--muted); }
  /* 2026-11-09: manual browsing (keyboard arrows or mouse). Buttons only show once someone
     uses the keyboard or mouse, so the plain TV view is unchanged. */
  .nav-btn {
    display: none;
    background: rgba(255,255,255,0.12);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 8px;
    font: inherit;
    font-size: 1rem;
    font-weight: 700;
    padding: 4px 14px;
    cursor: pointer;
  }
  .nav-btn:hover { background: rgba(255,255,255,0.25); }
  body.interactive .nav-btn { display: inline-block; }
  body.interactive { cursor: default; }
  #pager .dot { cursor: pointer; }
  #manual-note { font-size: 1rem; color: var(--warn); font-weight: 700; }
  #manual-note:empty { display: none; }
  .brand {
    display: inline-block;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--accent);
    background: rgba(158, 26, 65, 0.18);
    border: 1px solid var(--accent);
    border-radius: 20px;
    padding: 4px 16px;
    margin-bottom: 10px;
  }
  header h1 { font-size: 2.4rem; margin: 0; color: var(--text); }
  header p { font-size: 1.2rem; color: var(--text); margin: 4px 0 0; }
  #status { text-align: center; font-size: 1rem; color: var(--text); margin-bottom: 10px; }
  #status.stale { color: var(--warn); font-weight: 700; }
  #errorBanner {
    display: none;
    text-align: center;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text);
    background: var(--accent);
    border-radius: 8px;
    padding: 10px 16px;
    margin-bottom: 16px;
  }
  #errorBanner.show { display: block; }

  .section-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 18px;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--accent);
  }
  .section-num {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    background: var(--accent);
    color: var(--text);
    font-size: 1.4rem;
    font-weight: 800;
    border-radius: 50%;
  }
  .section-title {
    font-size: 1.9rem;
    font-weight: 700;
    color: var(--text);
  }

  .split-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(24rem, 1fr));
    gap: 20px;
  }
  .split-card {
    background: var(--card);
    border-radius: 12px;
    padding: 22px 26px;
    border-left: 8px solid var(--accent);
  }
  .card-heading {
    display: inline-block;
    background: var(--text);
    color: var(--card);
    font-weight: 700;
    padding: 4px 14px;
    border-radius: 6px;
    margin: 0 0 12px;
  }
  .split-card h2.card-heading { font-size: 1.9rem; }
  .field {
    display: flex;
    justify-content: space-between;
    font-size: 1.2rem;
    padding: 5px 6px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.15);
    color: var(--text);
  }
  .field span:first-child { color: var(--muted); }
  .field span:last-child { font-weight: 600; text-align: right; margin-left: 16px; color: var(--text); }
  .field.category {
    background: rgba(158, 26, 65, 0.28);
    border-left: 4px solid var(--accent);
    border-radius: 4px;
  }
  .field.category span:first-child,
  .field.category span:last-child {
    color: var(--text);
    font-weight: 800;
  }
  .details-heading.card-heading {
    display: block;
    width: fit-content;
    margin-top: 16px;
    font-size: 1.3rem;
  }
  .notes-heading.card-heading {
    display: block;
    width: fit-content;
    margin-top: 16px;
    font-size: 1.15rem;
    background: var(--accent);
    color: var(--text);
  }
  .notes-box {
    font-size: 1.15rem;
    line-height: 1.5;
    background: rgba(158, 26, 65, 0.28);
    border-left: 4px solid var(--accent);
    border-radius: 4px;
    padding: 12px 14px;
    white-space: pre-wrap;
  }
  /* 2026-11-03: a split card too tall for the screen flows into 2 or 3 columns
     (set by packSection) before anything is shrunk. */
  .split-card.cols-2 { column-count: 2; column-gap: 2.5rem; }
  .split-card.cols-3 { column-count: 3; column-gap: 2.5rem; }
  .split-card.cols-2 .field, .split-card.cols-3 .field,
  .split-card.cols-2 .card-heading, .split-card.cols-3 .card-heading { break-inside: avoid; }
  .split-card.cols-2 > h2.card-heading, .split-card.cols-3 > h2.card-heading,
  .split-card.cols-2 .notes-heading, .split-card.cols-3 .notes-heading,
  .split-card.cols-2 .notes-box, .split-card.cols-3 .notes-box { column-span: all; }
  .split-card.cols-2 .details-heading, .split-card.cols-3 .details-heading { break-before: column; margin-top: 0; }
  /* 2026-11-11 (Mike L.): keep "Cans This Run" and its bar together, full width, on the live card */
  .split-card.cols-2 .progress-block, .split-card.cols-3 .progress-block { column-span: all; break-inside: avoid; }
  .progress-block { break-inside: avoid; }
  body.held #nav-hold { display: inline-block; }
  #nav-hold.on { background: var(--live); color: #fff; }
  /* 2026-11-09: in 2/3-column mode the batch name must be a block so column-span works.
     As an inline-block it stayed in the left column only and pushed the left rows
     down, so they no longer lined up with the Packaging Details column. */
  .split-card.cols-2 > h2.card-heading, .split-card.cols-3 > h2.card-heading { display: block; width: fit-content; }
  /* The Packaging Details label takes the same height as one field row, so the rows
     on both sides line up. */
  .split-card.cols-2 .details-heading, .split-card.cols-3 .details-heading {
    box-sizing: border-box; height: var(--row-h, auto); margin-bottom: 0;
    display: flex; align-items: center; }
  .empty-state { text-align: center; font-size: 1.5rem; color: var(--text); margin-top: 60px; }

  /* ── Section 2: Efficiency ─────────────────────────────────────── */
  .run-card { position: relative; }
  .run-card.is-active { border-left-color: var(--live); }
  /* 2026-11-09: the run number sits beside the Live/Closed badge instead of pinned to the
     top-right corner, where it overlapped the "cans this run" count (Mike L.). */
  .run-order {
    display: inline-block;
    margin: 0 0 10px 10px;
    font-size: 1.1rem;
    font-weight: 800;
    color: var(--muted);
    vertical-align: middle;
  }
  .status-badge {
    display: inline-block;
    padding: 5px 16px;
    border-radius: 20px;
    font-weight: 800;
    text-transform: uppercase;
    font-size: 0.95rem;
    letter-spacing: 1px;
    margin-bottom: 10px;
  }
  .status-badge.active { background: var(--live); color: #ffffff; }
  .status-badge.active::before { content: "● "; animation: pulse 1.4s infinite; }
  .status-badge.closed { background: rgba(255, 255, 255, 0.15); color: var(--muted); }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  .eff-row { display: flex; justify-content: space-between; align-items: baseline; margin: 10px 0 14px; }
  .eff-label { font-size: 1.1rem; color: var(--muted); }
  .eff-value { font-size: 2.7rem; font-weight: 800; color: var(--text); }
  .eff-value.good { color: var(--eff-good); }
  .eff-value.caution { color: var(--eff-caution); }
  .eff-value.bad { color: var(--eff-bad); }

  .dt-row { display: flex; justify-content: space-between; font-size: 1.2rem; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.15); }
  .dt-row span:first-child { color: var(--muted); }
  .dt-row span:last-child { font-weight: 700; }

  .progress-block { margin: 10px 0 16px; }
  .progress-label { display: flex; justify-content: space-between; font-size: 1.1rem; color: var(--muted); margin-bottom: 6px; }
  .progress-value { font-size: 1.6rem; font-weight: 800; color: var(--text); }
  .progress-bar-track { background: rgba(255,255,255,0.12); border-radius: 10px; height: 18px; overflow: hidden; }
  .progress-bar-fill { background: var(--live); height: 100%; border-radius: 10px; transition: width 0.4s ease; }

  .secondary-stat { font-size: 1.2rem; color: var(--muted); margin-top: -4px; }
  .secondary-stat strong { color: var(--text); font-weight: 700; }

  .recap-card {
    background: linear-gradient(135deg, var(--card), #15304a);
    border: 2px solid var(--accent);
    border-radius: 14px;
    padding: 28px 32px;
    grid-column: 1 / -1;  /* recap spans the full row above the run cards */
  }
  .empty-state { grid-column: 1 / -1; }
  .recap-title { font-size: 1.6rem; font-weight: 800; margin-bottom: 18px; }
  .recap-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 20px; }
  .recap-stat-label { font-size: 1.05rem; color: var(--muted); margin-bottom: 4px; }
  .recap-stat-value { font-size: 2.6rem; font-weight: 800; }

  .section-placeholder {
    background: var(--card);
    border-radius: 12px;
    padding: 40px 24px;
    text-align: center;
    color: var(--muted);
    font-size: 1.2rem;
    border: 2px dashed rgba(255, 255, 255, 0.2);
  }
  /* 2026-11-09: phone / narrow window = one scrolling page, no rotation, no pager. */
  body.scroll-mode, html.scroll-mode { height: auto; overflow: auto; }
  body.scroll-mode { padding: 0.75rem; cursor: auto; -webkit-user-select: text; user-select: text; display: block; }
  body.scroll-mode header h1 { font-size: 1.6rem; }
  body.scroll-mode #stage { overflow: visible; }
  body.scroll-mode .page { position: static; opacity: 1; visibility: visible; transform: none !important; margin-bottom: 1.5rem; }
  body.scroll-mode .split-grid { grid-template-columns: 1fr; gap: 12px; }
  body.scroll-mode .split-card { padding: 14px 14px; }
  body.scroll-mode .split-card.cols-2, body.scroll-mode .split-card.cols-3 { column-count: 1; }
  body.scroll-mode .field { font-size: 1rem; flex-wrap: wrap; }
  body.scroll-mode .field span:last-child { margin-left: auto; }
  body.scroll-mode .eff-value { font-size: 2rem; }
  body.scroll-mode .recap-stat-value { font-size: 1.8rem; }
  body.scroll-mode #pager { display: none; }
</style>
</head>
<body>
  <header>
    <div class="brand">Harpoon Can Line</div>
    <h1>Can Line Packaging Information <span style="opacity:.6;font-size:12px;font-weight:400">v2026-11-11</span></h1>
    <p id="today-date"></p>
  </header>
  <div id="status">Loading...</div>
  <div id="errorBanner"></div>

  <!-- Pages are built by buildPages() and injected here, one visible at a time. -->
  <div id="stage"></div>
  <div id="pager"><button class="nav-btn" id="nav-prev" title="Previous page (Left arrow)">&#8249; Prev</button><div class="dots" id="pager-dots"></div><span class="page-label" id="pager-label"></span><button class="nav-btn" id="nav-next" title="Next page (Right arrow)">Next &#8250;</button><button class="nav-btn" id="nav-home" title="Back to the live run (Home key)">Live run</button><button class="nav-btn" id="nav-hold" title="Keep this page up until you press Release (H key)">Hold page</button><span id="manual-note"></span></div>

<script>
  // Section 1 (Today's Packaging Splits) -- "Packaging Split - Read for Tablet" flow.
  const SPLITS_FLOW_URL = "https://default5328b7ec2d7849d9a10e7c197feb0b.0c.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/27/workflows/77de2ad55a5447168524f93111297b0d/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=bfm67jPfzS6IOBUOC8dNzgisGqKCo4OYl2I_Nzk-QP0";

  // Section 2 (Efficiency) -- "Upstairs - TV Efficiency Feed" flow.
  // Kyle: open that flow in Power Automate, copy its "When a HTTP request is received"
  // / "Manually trigger a flow" URL, and paste it over the placeholder below --
  // directly in this file on your machine, never into chat. Until it's a real
  // URL, Section 2 will just show the "efficiency feed not yet connected" notice.
  const EFFICIENCY_FLOW_URL = "https://default5328b7ec2d7849d9a10e7c197feb0b.0c.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/31/workflows/1108e3aaf5924629bf688754b4ecb436/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=NIjk86dPBPohX5vBqz88BbdpoKZkte2edXyiFVIphgY";

  const REFRESH_INTERVAL_MS = 5 * 60 * 1000;  // normal poll cadence once things are healthy
  const RETRY_BACKOFF_MS   = [30, 60, 120].map(s => s * 1000); // fast retries after a failure
  const STALE_AFTER_MS     = 15 * 60 * 1000;  // warn if the board hasn't refreshed successfully in this long
  const RELOAD_AFTER_MS    = 6 * 60 * 60 * 1000; // full page reload every 6h -- keeps a 24/7 kiosk tab from drifting

  // ── TV page rotation (no one is there to scroll it) ──────────────────────
  // The board is split into pages that rotate on a timer instead of scrolling.
  // Tune these three numbers to taste:
  const PAGE_DWELL_MS        = 15 * 1000; // how long each page stays up
  const LIVE_TOUR_EVERY_MS   = 10 * 60 * 1000; // 2026-11-11 (Mike L.): while a run is live, every 10 min show the other pages once, then back to the live run
  const MAX_SPLITS_PER_PAGE  = 2;         // split cards shown side by side per page
  const MAX_RUNS_PER_PAGE    = 8;           // cards per Efficiency page (the day recap counts as one)

  let lastSuccessSplits = null;
  let lastSuccessEfficiency = null;
  let consecutiveFailures = 0;
  let pollTimer = null;
  let resizeTimer = null;
  let rotateTimer = null;
  let held = false;          // 2026-11-11: "Hold page" button / H key stops all page changes
  let touring = false;       // true while the 10-minute tour of the other pages is running
  let lastTour = Date.now();

  // The latest good card elements from each feed. Kept separately so that if one
  // feed fails, the other still refreshes and the failed one keeps its last cards.
  let splitItems = [];       // [HTMLElement]
  let efficiencyItems = [];  // [HTMLElement] -- recap card (if any) first, then run cards
  let pages = [];            // [HTMLElement] built by buildPages()
  let currentPage = 0;

  const SECTIONS = {
    splits:     { num: 1, title: "Today's Packaging Splits", maxCards: MAX_SPLITS_PER_PAGE },
    efficiency: { num: 2, title: 'Efficiency',               maxCards: MAX_RUNS_PER_PAGE }
  };

  function makePage(sectionKey) {
    const sec = SECTIONS[sectionKey];
    const page = document.createElement('div');
    page.className = 'page';
    page.dataset.section = sectionKey;
    page.innerHTML = `
      <div class="section-header">
        <span class="section-num">${sec.num}</span>
        <span class="section-title">${sec.title}<span class="page-count"></span></span>
      </div>
      <div class="split-grid"></div>
    `;
    return page;
  }

  // Greedy packing: add cards to a page until it hits the per-page cap or its real
  // rendered height no longer fits in the stage, then start a new page. A single
  // card taller than the stage is shrunk to fit as a last resort (so nothing is
  // ever cut off), but that should be rare.
  function packSection(sectionKey, items, stage) {
    const sectionPages = [];
    const maxCards = SECTIONS[sectionKey].maxCards;
    const stageH = stage.clientHeight;
    let page = null, grid = null, count = 0;
    items.forEach(it => it.classList && it.classList.remove('cols-2', 'cols-3')); // re-measure from scratch

    const startPage = () => {
      page = makePage(sectionKey);
      stage.appendChild(page);
      grid = page.querySelector('.split-grid');
      count = 0;
      sectionPages.push(page);
    };

    items.forEach(item => {
      if (!page) startPage();
      const heightBefore = page.offsetHeight;
      grid.appendChild(item);
      count++;
      const tooMany = count > maxCards;
      // Only a problem if adding this card made the page grow past the screen
      // (a card that just sits beside another one doesn't add any height).
      // 2026-11-03: if the page no longer fits, the new card goes to its own page (it then
      // gets the 2/3-column layout below) instead of shrinking both cards.
      const tooTall = count > 1 && page.offsetHeight > stageH;
      if (tooMany || tooTall) {
        grid.removeChild(item);
        startPage();
        grid.appendChild(item);
        count = 1;
      }
    });

    sectionPages.forEach((p, i) => {
      if (sectionPages.length > 1) p.querySelector('.page-count').textContent = `${i + 1} of ${sectionPages.length}`;
      // 2026-11-03: a single split card that is taller than the screen goes to 2, then 3
      // columns before falling back to shrinking.
      const cards = p.querySelectorAll('.split-grid > .split-card');
      if (cards.length === 1 && p.offsetHeight > stageH) {
        for (const cls of ['cols-2', 'cols-3']) {
          cards[0].classList.remove('cols-2', 'cols-3');
          cards[0].classList.add(cls);
          // 2026-11-09: Packaging Details label = one row tall, so both columns line up
          const firstField = cards[0].querySelector('.field');
          if (firstField) cards[0].style.setProperty('--row-h', firstField.offsetHeight + 'px');
          if (p.offsetHeight <= stageH) break;
          // 2026-11-09: 3 columns splits the batch fields across two columns (looks off on
          // laptops). Keep 2 columns and shrink a little if that is all it needs.
          if (cls === 'cols-2' && stageH / p.offsetHeight >= 0.8) break;
        }
      }
      const h = p.offsetHeight;
      p.style.transform = h > stageH && h > 0 ? `scale(${stageH / h})` : '';
    });
    return sectionPages;
  }

  function buildPages() {
    const stage = document.getElementById('stage');
    stage.innerHTML = '';
    pages = [];

    const hasSplits = splitItems.length > 0;
    const hasEff = efficiencyItems.length > 0;
    if (!hasSplits && !hasEff) { renderPager(); return; }

    // Phone or narrow window: one long scrolling page, live run section first.
    const scroll = isScrollMode();
    document.body.classList.toggle('scroll-mode', scroll);
    document.documentElement.classList.toggle('scroll-mode', scroll);
    if (scroll) {
      const order = homeFirst() ? ['efficiency', 'splits'] : ['splits', 'efficiency'];
      order.forEach(key => {
        const items = key === 'splits' ? splitItems : efficiencyItems;
        if (!items.length) return;
        items.forEach(it => it.classList && it.classList.remove('cols-2', 'cols-3'));
        const page = makePage(key);
        page.classList.add('active');
        const grid = page.querySelector('.split-grid');
        items.forEach(it => grid.appendChild(it));
        stage.appendChild(page);
        pages.push(page);
      });
      renderPager();
      return;
    }

    if (hasSplits) pages.push(...packSection('splits', splitItems, stage));
    if (hasEff)    pages.push(...packSection('efficiency', efficiencyItems, stage));

    if (currentPage >= pages.length) currentPage = 0;
    // After a refresh: stay where someone is browsing; otherwise the live run if there is one.
    const h = homePageIndex();
    showPage(!inManual() && !touring && !held && h !== null ? h : currentPage);
  }

  function showPage(index) {
    currentPage = index;
    pages.forEach((p, i) => p.classList.toggle('active', i === index));
    renderPager();
  }

  function renderPager() {
    const dots = document.getElementById('pager-dots');
    const label = document.getElementById('pager-label');
    if (pages.length <= 1) { dots.innerHTML = ''; label.textContent = ''; return; }
    dots.innerHTML = pages.map((_, i) => `<span class="dot${i === currentPage ? ' active' : ''}" data-i="${i}"></span>`).join('');
    const h = homePageIndex();
    label.textContent = `Page ${currentPage + 1} of ${pages.length}` + (h !== null && currentPage === h ? ' · Live run' : '');
    const note = document.getElementById('manual-note');
    if (note && held) { note.textContent = 'Held on this page. Press Release (or H) to go back to normal.'; return; }
    if (note) {
      const left = manualUntil - Date.now();
      note.textContent = left > 0 && h !== null
        ? `Back to the live run in ${Math.floor(left / 60000)}:${String(Math.floor(left / 1000) % 60).padStart(2, '0')}`
        : '';
    }
  }

  // 2026-11-09 (Mike L.): the live run is "home". While a run is live the board stays on
  // it instead of rotating. Arrow keys / mouse page through splits and other runs; after
  // IDLE_RETURN_MS with no keyboard or mouse input it goes back to the live run on its own.
  // No live run (start of day, between runs) = rotate every PAGE_DWELL_MS like before.
  const IDLE_RETURN_MS = 2 * 60 * 1000;
  let manualUntil = 0;

  function isScrollMode() { return window.innerWidth <= 760; }
  function homeFirst() { return efficiencyItems.some(it => it.classList && it.classList.contains('is-active')); }
  function homePageIndex() {
    const i = pages.findIndex(p => p.querySelector('.run-card.is-active'));
    return i === -1 ? null : i;
  }
  function inManual() { return Date.now() < manualUntil; }
  function goHome() {
    manualUntil = 0; touring = false; lastTour = Date.now();
    const h = homePageIndex();
    if (h !== null) showPage(h);
    renderPager();
  }
  function manualStep(delta) {
    if (pages.length === 0 || isScrollMode()) return;
    manualUntil = Date.now() + IDLE_RETURN_MS;
    showPage((currentPage + delta + pages.length) % pages.length);
  }
  function showInteractive() {
    document.body.classList.add('interactive');
    clearTimeout(showInteractive.t);
    showInteractive.t = setTimeout(() => document.body.classList.remove('interactive'), IDLE_RETURN_MS);
  }

  function startRotation() {
    if (rotateTimer) clearInterval(rotateTimer);
    let sinceTurn = 0;
    // One-second tick: handles the idle return promptly; turns the page every PAGE_DWELL_MS.
    rotateTimer = setInterval(() => {
      if (isScrollMode()) return;
      if (held) { renderPager(); return; }
      if (manualUntil && !inManual()) { goHome(); sinceTurn = 0; return; }
      renderPager();
      if (inManual()) return;
      const h = homePageIndex();
      if (h !== null) {
        if (!touring) {
          if (currentPage !== h) showPage(h);
          if (pages.length > 1 && Date.now() - lastTour >= LIVE_TOUR_EVERY_MS) { touring = true; sinceTurn = 0; showPage((h + 1) % pages.length); }
          return;
        }
        sinceTurn += 1000;
        if (sinceTurn >= PAGE_DWELL_MS) {
          sinceTurn = 0;
          const next = (currentPage + 1) % pages.length;
          if (next === h) { touring = false; lastTour = Date.now(); }
          showPage(next);
        }
        return;
      }
      sinceTurn += 1000;
      if (sinceTurn >= PAGE_DWELL_MS) {
        sinceTurn = 0;
        if (pages.length > 1) showPage((currentPage + 1) % pages.length);
      }
    }, 1000);
  }

  document.addEventListener('keydown', e => {
    showInteractive();
    if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { manualStep(1); e.preventDefault(); }
    else if (['ArrowLeft', 'PageUp'].includes(e.key)) { manualStep(-1); e.preventDefault(); }
    else if (['Home', 'Escape'].includes(e.key)) { goHome(); e.preventDefault(); }
    else if (e.key === 'h' || e.key === 'H') { toggleHold(); e.preventDefault(); }
  });
  document.addEventListener('mousemove', showInteractive);
  document.addEventListener('click', e => {
    showInteractive();
    if (e.target.id === 'nav-prev') manualStep(-1);
    else if (e.target.id === 'nav-next') manualStep(1);
    else if (e.target.id === 'nav-home') goHome();
    else if (e.target.id === 'nav-hold') toggleHold();
    else if (e.target.classList && e.target.classList.contains('dot')) {
      manualUntil = Date.now() + IDLE_RETURN_MS;
      showPage(Number(e.target.dataset.i));
    }
  });

  function toggleHold() {
    held = !held;
    document.body.classList.toggle('held', held);
    const b = document.getElementById('nav-hold');
    if (b) { b.textContent = held ? 'Release' : 'Hold page'; b.classList.toggle('on', held); }
    if (!held) { manualUntil = Date.now() + IDLE_RETURN_MS; }   // releasing: normal 2-minute return to the live run
    renderPager();
  }

  function formatDateHeader() {
    const today = new Date();
    document.getElementById('today-date').textContent = today.toLocaleDateString('en-US', {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    });
  }

  function parseDetails(html) {
    const temp = document.createElement('div');
    temp.innerHTML = html || '';
    const text = temp.textContent || temp.innerText || '';
    return text.split(/\||\n/)
      .map(s => s.trim())
      .filter(s => s.length > 0)
      .map(item => {
        const idx = item.indexOf(':');
        if (idx === -1) return { label: '', value: item, isCategory: false };
        const label = item.slice(0, idx).trim();
        const value = item.slice(idx + 1).trim();
        const isCategory = /total qty/i.test(value);
        return { label, value, isCategory };
      });
  }

  // 2026-11-09: this board shows only its own line's half of a split. The Packaging Details
  // text comes in groups, each starting with a "total qty" row ("12oz 2/12 Cans", "13.2g Kegs").
  // Groups whose header mentions kegs belong to racking; every other group belongs to canning.
  // The main info (batch, BBT, job, volumes, notes) shows on both boards.
  const BOARD_LINE = 'can';
  function lineDetails(details) {
    const keep = [];
    let groupIsKeg = null; // rows before the first group header show on both boards
    details.forEach(d => {
      if (d.isCategory) groupIsKeg = /keg/i.test(d.label);
      const mine = groupIsKeg === null || (BOARD_LINE === 'rack' ? groupIsKeg : !groupIsKeg);
      if (mine) keep.push(d);
    });
    return keep;
  }
  // Volumes: round to 2 decimal places (the flow can send 10.4749999999999).
  function fmtVol(v) {
    if (v === null || v === undefined || v === '') return '';
    const n = Number(v);
    return isNaN(n) ? v : n.toLocaleString('en-US', { maximumFractionDigits: 2 });
  }

  function fieldHtml(label, value, highlight) {
    return `<div class="field${highlight ? ' category' : ''}"><span>${label}</span><span>${value}</span></div>`;
  }

  // ── Section 1: Today's Packaging Splits ──────────────────────────
  function renderSplitsSection(rows) {
    const items = [];

    if (!rows || rows.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'No packaging splits scheduled for today.';
      splitItems = [empty];
      return;
    }

    // 2026-10-09: show splits in schedule order -- Canning Order, then Racking
    // Order, then beer/batch name. Blank orders go last. "1", "1st", "#1" all read as 1.
    const orderNum = v => {
      const raw = (v && typeof v === 'object') ? v.Value : v;
      const n = parseInt(String(raw ?? '').replace(/[^0-9]/g, ''), 10);
      return isNaN(n) ? Infinity : n;
    };
    rows = [...rows].sort((a, b) =>
      (orderNum(a.CanningOrder) - orderNum(b.CanningOrder)) ||
      (orderNum(a.RackingOrder) - orderNum(b.RackingOrder)) ||
      String(a.BeerBatch ?? '').localeCompare(String(b.BeerBatch ?? '')));

    rows.forEach(row => {
      const myDetails = lineDetails(parseDetails(row.PackagingDetails));
      const rackingVal = row.RackingOrder?.Value ?? row.RackingOrder ?? '';
      const canningVal = row.CanningOrder?.Value ?? row.CanningOrder ?? '';
      // A split with nothing for this line (no groups, no order) is left off this board.
      const myOrder = BOARD_LINE === 'rack' ? rackingVal : canningVal;
      if (!myDetails.some(d => d.isCategory) && !myOrder) return;
      const detailRows = myDetails
        .map(d => `<div class="field${d.isCategory ? ' category' : ''}"><span>${d.label}</span><span>${d.value}</span></div>`)
        .join('');

      const orderFields = BOARD_LINE === 'rack'
        ? (rackingVal ? fieldHtml('Racking Order', rackingVal, true) : '')
        : (canningVal ? fieldHtml('Canning Order', canningVal, true) : '');

      const notesVal = (row.Notes ?? '').replace(/^\s*notes\s*[:\-]\s*/i, '').trim();
      const notesBlock = notesVal ? `
        <div class="notes-heading card-heading">Notes</div>
        <div class="notes-box">${notesVal}</div>
      ` : '';

      const card = document.createElement('div');
      card.className = 'split-card';
      card.innerHTML = `
        <h2 class="card-heading">${row.BeerBatch ?? ''}</h2>
        <div class="field"><span>BBT</span><span>${row.BBT ?? ''}</span></div>
        <div class="field"><span>Deacom Job</span><span>${row.DeacomJob ?? ''}</span></div>
        <div class="field"><span>Beer Family</span><span>${row.BeerFamily?.Value ?? row.BeerFamily ?? ''}</span></div>
        <div class="field"><span>Tank Volume</span><span>${fmtVol(row.TankVolume)}</span></div>
        <div class="field"><span>Total Scheduled Volume</span><span>${fmtVol(row.TotalScheduledVolume)}</span></div>
        <div class="field"><span>Extra Beer Volume</span><span>${fmtVol(row.ExtraBeerVolume)}</span></div>
        <div class="field"><span>Extra Beer After Split</span><span>${fmtVol(row.ExtraBeerAfterSplit)}</span></div>
        <div class="field"><span>Total Beer Volume To Be Packaged</span><span>${fmtVol(row.TotalBeerVolumeToBePackaged)}</span></div>
        ${orderFields}
        <div class="details-heading card-heading">Packaging Details</div>
        ${detailRows}
        ${notesBlock}
      `;
      items.push(card);
    });
    if (items.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = BOARD_LINE === 'rack' ? 'No racking splits scheduled for today.' : 'No canning splits scheduled for today.';
      items.push(empty);
    }
    splitItems = items;
  }

  // ── Section 2: Efficiency ─────────────────────────────────────────
  // Field names here match the "Upstairs - TV Efficiency Feed" flow's real
  // output exactly:
  //   Closed run: RunOrder, JobNumKey, PkgConfig, RunStatus, OverallPkgLineEff,
  //               GrandTotalDT, NetCases, BatchNum, RunStartTimestamp, QualTime
  //   Open run:   RunOrder, JobNumKey, PkgConfig, RunStatus, OverallFillerEff,
  //               DTSoFar, DTNotesSoFar (pipe-joined text), FillerCounter,
  //               TotalScheduledCans, BatchNum, RunStartTimestamp, QualTime
  // "Started" is driven by QualTime, not RunStartTimestamp -- QualTime is the
  // time the operator set/qualified the run to, stored as plain "HH:MM" 24-hr
  // text (no date, no AM/PM). RunStartTimestamp is when the tablet form was
  // actually submitted, which can lag the real start, so it's not used for display.

  function effTier(pct) {
    if (pct === null || pct === undefined) return '';
    if (pct >= 75) return 'good';
    if (pct >= 60) return 'caution';
    return 'bad';
  }

  function fmtPct(val) {
    return (val === null || val === undefined) ? '—' : val.toFixed(1) + '%';
  }

  function formatStartTime(qualTime) {
    // QualTime is plain "HH:MM" 24-hour text (e.g. "07:37", "18:00") -- no date,
    // no AM/PM -- so this just reformats it rather than parsing it as a Date.
    if (!qualTime) return null;
    const m = /^(\d{1,2}):(\d{2})$/.exec(String(qualTime).trim());
    if (!m) return null;
    let hour = parseInt(m[1], 10);
    const minute = m[2];
    const suffix = hour >= 12 ? 'PM' : 'AM';
    hour = hour % 12;
    if (hour === 0) hour = 12;
    return `${hour}:${minute} ${suffix}`;
  }

  function buildDayRecap(runs) {
    const allClosed = runs.length > 0 && runs.every(r => r.RunStatus === 'Closed');
    if (!allClosed) return null;
    // 2026-10-09: weight by TOTAL cases produced (falls back to NetCases if the feed
    // doesn't send TotalCases) so a run fully put on hold afterward still counts.
    const casesOf = r => (r.TotalCases != null ? r.TotalCases : (r.NetCases || 0)) || 0;
    const totalCases = runs.reduce((sum, r) => sum + casesOf(r), 0);
    const weightedEff = runs.reduce((sum, r) => sum + (r.OverallPkgLineEff || 0) * casesOf(r), 0) / (totalCases || 1);
    const totalDT = runs.reduce((sum, r) => sum + (r.GrandTotalDT || 0), 0);
    const tier = effTier(weightedEff) || 'good';

    const recap = document.createElement('div');
    recap.className = 'recap-card';
    recap.innerHTML = `
        <div class="recap-title">Day Recap — ${runs.length} Run${runs.length === 1 ? '' : 's'} Complete</div>
        <div class="recap-stats">
          <div>
            <div class="recap-stat-label">Day Efficiency (case-weighted)</div>
            <div class="recap-stat-value" style="color: var(--eff-${tier})">${weightedEff.toFixed(1)}%</div>
          </div>
          <div>
            <div class="recap-stat-label">Total Downtime</div>
            <div class="recap-stat-value">${totalDT} min</div>
          </div>
          <div>
            <div class="recap-stat-label">Total Cases</div>
            <div class="recap-stat-value">${totalCases.toLocaleString()}</div>
          </div>
        </div>
    `;
    return recap;
  }

  // 2026-10-09: hard cap at 100% (matches the recap email). A short run can
  // compute above 100%; every efficiency shown on the TV -- live cards, closed
  // cards and the case-weighted day recap -- uses the capped value.
  function cap100(v) {
    return (v === null || v === undefined || isNaN(v)) ? v : Math.min(100, Number(v));
  }

  function renderEfficiencySection(runs) {
    if (runs && runs.length) {
      runs = runs.map(r => Object.assign({}, r, {
        OverallPkgLineEff: cap100(r.OverallPkgLineEff),
        OverallFillerEff:  cap100(r.OverallFillerEff)
      }));
    }
    if (!runs || runs.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'No runs today yet.';
      efficiencyItems = [empty];
      return;
    }
    const items = [];

    // Day-sequence order -- same order as the splits in Section 1, not resorted by status.
    const sorted = [...runs].sort((a, b) => a.RunOrder - b.RunOrder);

    sorted.forEach(run => {
      const isActive = run.RunStatus === 'Open';
      const heading = run.BatchNum || run.JobNumKey || '';
      const startedTime = formatStartTime(run.QualTime);
      const startedField = startedTime ? `<div class="field"><span>Started</span><span>${startedTime}</span></div>` : '';
      // 2026-11-11 (Kyle): closed runs also show Last Pallet Out (Runs.PackOutTime). Hidden until the feed sends it.
      const packOut = !isActive ? formatStartTime(run.PackOutTime) : null;
      const packOutField = packOut ? `<div class="field"><span>Last Pallet Out</span><span>${packOut}</span></div>` : '';

      const card = document.createElement('div');
      card.className = 'split-card run-card' + (isActive ? ' is-active' : '');

      let body = `
        <span class="status-badge ${isActive ? 'active' : 'closed'}">${isActive ? 'Live' : 'Closed'}</span><span class="run-order">Run #${run.RunOrder}</span>
        <h2 class="card-heading">${heading}</h2>
        <div class="field"><span>Deacom Job</span><span>${run.JobNumKey ?? ''}</span></div>
        <div class="field"><span>Size</span><span>${run.PkgConfig ?? ''}</span></div>
        ${startedField}
        ${packOutField}
      `;

      if (isActive) {
        const hasProgress = run.FillerCounter != null && run.TotalScheduledCans > 0;
        const pct = hasProgress ? Math.min(100, Math.round((run.FillerCounter / run.TotalScheduledCans) * 100)) : null;
        if (hasProgress) {
          body += `
            <div class="progress-block">
              <div class="progress-label">
                <span>Cans This Run</span>
                <span class="progress-value">${run.FillerCounter.toLocaleString()} / ${run.TotalScheduledCans.toLocaleString()}</span>
              </div>
              <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
            </div>
          `;
        }
        body += `
          <div class="eff-row">
            <span class="eff-label">Filler Efficiency</span>
            <span class="eff-value ${effTier(run.OverallFillerEff)}">${fmtPct(run.OverallFillerEff)}</span>
          </div>
          <div class="dt-row"><span>Downtime So Far</span><span>${run.DTSoFar ?? 0} min</span></div>
        `;
        if (run.DTNotesSoFar) {
          body += `
            <div class="notes-heading card-heading">DT Notes So Far</div>
            <div class="notes-box">${run.DTNotesSoFar.split(' | ').join('<br>')}</div>
          `;
        }
      } else {
        body += `
          <div class="eff-row">
            <span class="eff-label">Packaging Line Efficiency</span>
            <span class="eff-value ${effTier(run.OverallPkgLineEff)}">${fmtPct(run.OverallPkgLineEff)}</span>
          </div>
          <div class="dt-row"><span>Final Case Count</span><span>${(run.TotalCases ?? run.NetCases ?? 0).toLocaleString()}</span></div>
          <div class="dt-row"><span>Total Downtime</span><span>${run.GrandTotalDT ?? 0} min</span></div>
        `;
      }

      card.innerHTML = body;
      items.push(card);
    });

    // Day recap (only once every run is closed) goes first, above the run cards.
    const recap = buildDayRecap(sorted);
    efficiencyItems = recap ? [recap, ...items] : items;
  }

  function minutesAgo(ms) {
    const mins = Math.floor(ms / 60000);
    if (mins < 1) return 'just now';
    if (mins === 1) return '1 min ago';
    return mins + ' min ago';
  }

  function updateStatusText() {
    const status = document.getElementById('status');
    if (!lastSuccessSplits && !lastSuccessEfficiency) return; // still on "Loading..." until the first successful fetch
    const known = [lastSuccessSplits, lastSuccessEfficiency].filter(Boolean).sort((a, b) => a - b);
    const oldest = known[0];
    const age = Date.now() - oldest;
    const stale = age > STALE_AFTER_MS;
    let text = `Last updated: ${new Date(oldest).toLocaleTimeString()} (${minutesAgo(age)})`;
    if (!lastSuccessEfficiency) text += ' -- efficiency feed not yet connected';
    if (stale) text += ' -- board may be stuck, check the flow';
    status.textContent = text;
    status.classList.toggle('stale', stale);
  }

  function showError(message) {
    const banner = document.getElementById('errorBanner');
    banner.textContent = 'Not syncing: ' + message + ' -- showing last known data.';
    banner.classList.add('show');
  }

  function clearError() {
    document.getElementById('errorBanner').classList.remove('show');
  }

  async function fetchAll() {
    const errors = [];

    try {
      const response = await fetch(SPLITS_FLOW_URL);
      if (!response.ok) throw new Error('status ' + response.status);
      renderSplitsSection(await response.json());
      lastSuccessSplits = Date.now();
    } catch (err) {
      errors.push('Splits: ' + err.message);
    }

    try {
      if (EFFICIENCY_FLOW_URL.startsWith('PASTE_')) throw new Error('URL not set yet');
      const response = await fetch(EFFICIENCY_FLOW_URL);
      if (!response.ok) throw new Error('status ' + response.status);
      renderEfficiencySection(await response.json());
      lastSuccessEfficiency = Date.now();
    } catch (err) {
      errors.push('Efficiency: ' + err.message);
    }

    if (errors.length) {
      consecutiveFailures++;
      showError(errors.join(' | '));
    } else {
      consecutiveFailures = 0;
      clearError();
    }
    updateStatusText();
    buildPages();
    scheduleNextFetch();
  }

  function scheduleNextFetch() {
    if (pollTimer) clearTimeout(pollTimer);
    // Fast retries right after a failure so a blip clears itself in under a minute;
    // settle back to the normal cadence once it's healthy or retries are exhausted.
    const delay = consecutiveFailures > 0 && consecutiveFailures <= RETRY_BACKOFF_MS.length
      ? RETRY_BACKOFF_MS[consecutiveFailures - 1]
      : REFRESH_INTERVAL_MS;
    pollTimer = setTimeout(fetchAll, delay);
  }

  formatDateHeader();
  fetchAll();
  startRotation();
  setInterval(updateStatusText, 30 * 1000);
  // Screen/window size can't change on a dedicated TV, but repaginate on resize
  // anyway (covers testing on a desktop browser, or a different TV later).
  window.addEventListener('resize', () => {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(buildPages, 150);
  });
  // 24/7 kiosk tab: force a clean reload periodically rather than trusting long-running JS state.
  setTimeout(() => location.reload(), RELOAD_AFTER_MS);
</script>
</body>
</html>
