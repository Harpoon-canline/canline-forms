<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Packaging Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<!--
  Packaging Live  v2026-11-11  (demo of the SQL-era dashboard)
  ------------------------------------------------------------
  Data: one read-only feed (LIVE_FEED_URL below). Until it is set, the page shows the
  built-in snapshot (pulled from SharePoint 11/11 ~9:50 AM) and says so in the header.

  Feed contract (what the read-only flow returns, JSON):
    { "asOf": "<ISO time>",
      "Runs": [...], "RackRuns": [...],                         // last ~14 days
      "HourlyEntries": [...], "RackHourlyEntries": [...],      // open + recent runs
      "HourlyDTEvents": [...], "RackDTEvents": [...] }         // last ~14 days
  Each array = SharePoint items with these internal names (Select columns in the flow):
    Runs: ID, RunDate, field_2 (batch), field_8 (qual), field_43 (end), PkgConfig, field_12 (rated CPM),
          field_14 (scheduled cases), field_56 (total cases), field_57 (net), field_54 (on hold),
          field_45 (DT min), field_59 (line eff %), RunStatus, PackOutTime
    RackRuns: ID, RunDate, BatchNum, QualTime, EndTime, KegSize, RatedPerHour, ScheduledKegs,
          FinalCount, FillerCount, GrandTotalDT, RunEffPct, RunStatus, Dumps
    HourlyEntries: RunId, field_2 (hour), field_3 (start), field_4 (end), field_6 (cans), field_7 (eff), field_8 (DT)
    RackHourlyEntries: RunID, HourNum, WindowStart, WindowEnd, KegsThisHour, EffPct, DTMinsThisHour
    HourlyDTEvents: RunID, field_2 (hour), field_4 (minutes), Machine, Planned
    RackDTEvents: RunID, HourNum, Minutes, Machine, Planned
  No costs, pay or contract names are shown on this page (it is public).
  In the SQL version the same page reads rpt views instead (rpt.v_live_runs, rpt.v_run_hours,
  rpt.v_downtime_week, rpt.v_startup, rpt.v_plan_vs_actual).
-->
<style>
/* Layout: navy header band with logo and controls; tabbed panels below; cards wrap to one column on phones */
:root{
  --navy:#204667; --red:#9e1a41; --bg:#f3f5f8; --panel:#ffffff; --fg:#17212e; --muted:#5d6a7c; --line:#dbe1ea;
  --soft:#e8eef6; --ok:#2e7d4f; --ok-soft:#e3f2e8; --warn:#b26a00; --warn-soft:#fbefd9; --bad:#b3262e; --bad-soft:#fae3e4;
  --can:#204667; --rack:#9e1a41; --plan:#aab6c6;
  --display:"Space Grotesk",system-ui,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141c; --panel:#18202c; --fg:#e6ebf2; --muted:#98a4b6; --line:#2a3443; --soft:#1e2938;
  --ok:#74c795; --ok-soft:#183324; --warn:#e3a54a; --warn-soft:#3a2c14; --bad:#ef7a80; --bad-soft:#3a1d21;
  --can:#7fa8dc; --rack:#e58aa5; --plan:#4c5a6e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141c; --panel:#18202c; --fg:#e6ebf2; --muted:#98a4b6; --line:#2a3443; --soft:#1e2938;
  --ok:#74c795; --ok-soft:#183324; --warn:#e3a54a; --warn-soft:#3a2c14; --bad:#ef7a80; --bad-soft:#3a1d21;
  --can:#7fa8dc; --rack:#e58aa5; --plan:#4c5a6e; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--body);padding-bottom:env(safe-area-inset-bottom,0px)}
.band{background:var(--navy);color:#fff;padding-top:env(safe-area-inset-top,0px)}
.wrap{max-width:min(1880px,100%);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:14px}
.logo{height:40px;width:auto;display:block}
.title{display:flex;flex-direction:column;gap:2px;margin-right:auto}
.title h1{font:700 1.25rem/1.1 var(--display);margin:0;letter-spacing:.01em}
.status{font-size:.8rem;opacity:.85;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#f5c04a;display:inline-block}
.dot.live{background:#5fd38d}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;background:rgba(255,255,255,.12);border-radius:8px;padding:3px}
.seg button{border:0;background:transparent;color:#fff;font:600 .8rem var(--body);padding:6px 12px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:#fff;color:var(--navy)}
.btn{border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;font:600 .8rem var(--body);padding:7px 14px;border-radius:8px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.btn:hover{background:rgba(255,255,255,.12)}
.btn:disabled{opacity:.6;cursor:default}
button:focus-visible{outline:2px solid #f5c04a;outline-offset:2px}
.ticker{background:var(--red);color:#fff;font-size:.82rem;overflow:hidden;white-space:nowrap}
.ticker .wrap{display:flex;gap:12px;align-items:center;padding-block:7px}
.ticker b{flex:none;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.7rem;background:rgba(0,0,0,.18);padding:3px 8px;border-radius:4px}
.ticker .track{overflow:hidden;flex:1;min-width:0}
.ticker .inner{display:inline-block;padding-left:100%;animation:scroll 45s linear infinite}
@keyframes scroll{to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.ticker .inner{animation:none;padding-left:0}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:16px;overflow-x:auto}
.tabs button{border:0;background:none;font:600 .9rem var(--body);color:var(--muted);padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--red)}
main{padding-block:18px 40px;display:flex;flex-direction:column;gap:18px}
#p-week,#p-start,#p-dt,#p-oee,#p-co{display:flex;flex-direction:column;gap:16px}
.kpi.good strong{color:var(--ok)} .kpi.mid strong{color:var(--warn)} .kpi.low strong{color:var(--bad)}
.kpi em{font-style:normal;font-size:.72rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:16px}
/* wide screens: use the space (v2026-11-12b) */
@media (min-width:1500px){html{font-size:17px}.wrap{padding-left:32px;padding-right:32px}}
@media (min-width:1900px){html{font-size:18px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font:600 1.05rem/1.2 var(--display);margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3{font:600 .8rem/1.2 var(--body);margin:0;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sub{color:var(--muted);font-size:.85rem}
.mono{font:600 .85rem/1.4 ui-monospace,Consolas,monospace;background:rgba(127,127,127,.12);border-radius:6px;padding:6px 8px}
.chip{font:600 .72rem/1 var(--body);padding:5px 8px;border-radius:999px;white-space:nowrap}
.c-open{background:var(--ok-soft);color:var(--ok)} .c-closed{background:var(--soft);color:var(--muted)}
.c-warn{background:var(--warn-soft);color:var(--warn)} .c-bad{background:var(--bad-soft);color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:520px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--soft);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.kpi span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kpi strong{font:700 1.35rem/1.1 var(--display);font-variant-numeric:tabular-nums}
.bar{height:10px;background:var(--soft);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--body);fill:var(--muted)}
.tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);font-size:.78rem;line-height:1.35;padding:7px 9px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-100%);margin-top:-8px;opacity:0;transition:opacity .1s;z-index:5}
.tip.on{opacity:1}
table{border-collapse:collapse;width:100%;font-size:.86rem;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font:600 .7rem/1.2 var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
td.n,th.n{text-align:right}
.scroll{overflow-x:auto}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px}
.note{font-size:.8rem;color:var(--muted)}
.empty{color:var(--muted);font-size:.9rem;padding:20px 0}
.sqlnote{border-left:3px solid var(--navy);background:var(--soft);padding:8px 12px;border-radius:4px;font-size:.8rem;color:var(--muted)}
.sqlnote code{font-family:ui-monospace,Consolas,monospace;color:var(--fg)}
[hidden]{display:none!important}
@media (max-width:560px){.logo{height:30px}.title h1{font-size:1.05rem}}
</style>
</head>

/* ===== Data: normalise both lines into one shape ===== */
// SharePoint choice columns come back from Get items as {Value:"..."}; plain text from the snapshot.
const cv = v => (v && typeof v==='object' && 'Value' in v) ? v.Value : v;
function asList(v){ if(typeof v==='string'){ try{ v=JSON.parse(v); }catch(e){ return v; } } if(Array.isArray(v) && v.length===1 && Array.isArray(v[0])) v=v[0]; return v && v.value && Array.isArray(v.value) ? v.value : v; }
function unwrap(list){ return (list||[]).map(r=>{ const o={}; for(const k in r) o[k]=cv(r[k]); return o; }); }
function model(raw){
  raw = Object.fromEntries(Object.entries(raw).map(([k,v])=>{ v=asList(v); return [k, Array.isArray(v)?unwrap(v):v]; }));
  const asOfTxt = String(raw.asOf||'').replace(/[\[\]"]/g,''); const asOf = asOfTxt && !isNaN(new Date(asOfTxt)) ? new Date(asOfTxt) : new Date();
  const runs = [];
  (raw.Runs||[]).forEach(r=>runs.push({ line:'can', id:r.ID, day:dayKey(r.RunDate), batch:r.field_2, pkg:pkgShort(r.PkgConfig),
    qual:toMin(r.field_8), end:toMin(r.field_43), packOut:toMin(r.PackOutTime), rated:num(r.field_12), sched:num(r.field_14), unit:'cases',
    out:num(r.field_56), good:num(r.field_57), dt:num(r.field_45), eff:num(r.field_59), open:r.RunStatus==='Open' }));
  (raw.RackRuns||[]).forEach(r=>runs.push({ line:'rack', id:r.ID, day:dayKey(r.RunDate), batch:r.BatchNum, pkg:String(r.KegSize||''),
    qual:toMin(r.QualTime), end:toMin(r.EndTime), packOut:null, rated:num(r.RatedPerHour), sched:num(r.ScheduledKegs), unit:'kegs',
    out:num(r.FinalCount), filler:num(r.FillerCount), dt:num(r.GrandTotalDT), eff:num(r.RunEffPct), open:r.RunStatus==='Open' }));
  const hours = [];
  (raw.HourlyEntries||[]).forEach(h=>hours.push({ line:'can', run:h.RunId, hour:num(h.field_2), start:toMin(h.field_3), end:toMin(h.field_4), units:num(h.field_6)/CANS_PER_CASE, eff:num(h.field_7), dt:num(h.field_8) }));
  (raw.RackHourlyEntries||[]).forEach(h=>hours.push({ line:'rack', run:h.RunID, hour:num(h.HourNum), start:toMin(h.WindowStart), end:toMin(h.WindowEnd), units:num(h.KegsThisHour), eff:num(h.EffPct), dt:num(h.DTMinsThisHour) }));
  const dts = [];
  (raw.HourlyDTEvents||[]).forEach(d=>dts.push({ line:'can', run:d.RunID, hour:num(d.field_2), min:num(d.field_4), machine:d.Machine, planned:/^p/i.test(d.Planned||'') }));
  (raw.RackDTEvents||[]).forEach(d=>dts.push({ line:'rack', run:d.RunID, hour:num(d.HourNum), min:num(d.Minutes), machine:d.Machine, planned:/^p/i.test(d.Planned||'') }));
  runs.sort((a,b)=>a.day<b.day?-1:a.day>b.day?1:(a.qual||0)-(b.qual||0));
  return { asOf, runs, hours, dts };
}
const lines = () => state.line==='both' ? ['can','rack'] : [state.line];

/* ===== Load / refresh ===== */
async function load(){
  const btn=$('#refresh'); btn.disabled=true; btn.textContent='↻ Refreshing…';
  let raw=SNAPSHOT, live=false, msg='';
  if (LIVE_FEED_URL){
    try { const r = await fetch(LIVE_FEED_URL,{cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status); raw = await r.json(); live=true; }
    catch(e){ msg=' (feed did not answer: '+e.message+'; showing snapshot)'; }
  }
  state.data = model(raw); state.asOf = state.data.asOf; state.live = live;
  $('#dot').classList.toggle('live',live);
  $('#statusText').textContent = (live ? 'Live · updated ' : 'Snapshot · ') + state.asOf.toLocaleString('en-US',{weekday:'short',month:'numeric',day:'numeric',hour:'numeric',minute:'2-digit'}) + (live?'':' · feed not connected') + msg;
  btn.disabled=false; btn.textContent='↻ Refresh';
  render();
}

/* ===== Hover-snapping chart helper =====
   Any x position over the chart snaps to the nearest item, with one tooltip. */
function attachHover(wrap, svg, items, W){
  const tip = el('div',{class:'tip'}); wrap.append(tip);
  const guide = svgEl('line',{y1:0,y2:svg.viewBox.baseVal.height,stroke:'currentColor','stroke-opacity':'.25','stroke-dasharray':'3 3',visibility:'hidden'});
  svg.append(guide);
  const move = ev => {
    const r = svg.getBoundingClientRect(); const x = (('touches' in ev ? ev.touches[0].clientX : ev.clientX) - r.left) * (W / r.width);
    let best=null, bd=1e9; items.forEach(it=>{ const d=Math.abs(it.x-x); if(d<bd){bd=d;best=it;} });
    if(!best) return;
    guide.setAttribute('x1',best.x); guide.setAttribute('x2',best.x); guide.setAttribute('visibility','visible');
    tip.innerHTML = best.tip; tip.classList.add('on');
    const px = best.x * r.width / W; tip.style.left = Math.min(Math.max(px,80), r.width-80)+'px'; tip.style.top = (best.y * r.height / svg.viewBox.baseVal.height)+'px';
  };
  const out = () => { tip.classList.remove('on'); guide.setAttribute('visibility','hidden'); };
  svg.addEventListener('mousemove',move); svg.addEventListener('touchstart',move,{passive:true}); svg.addEventListener('touchmove',move,{passive:true});
  svg.addEventListener('mouseleave',out);
}

   line efficiency (volume weighted) = Availability x Performance; OEE = line efficiency x Quality;
   Availability = (run time - downtime) / run time; Performance = line efficiency / Availability;
   Quality: Can = net / total cases, Racker = final / filler kegs; TEEP = OEE x run hours / 168 per week. */
const runMins = r => (r.qual==null||r.end==null) ? 0 : ((r.end - r.qual + 1440) % 1440);

  const W=900,rowH=26,L=150,R=70,T=20,H=T+rows.length*rowH+8; const maxM=Math.max(...rows.map(r=>Math.max(r.mins,r.std)))+20; const x=m=>L+(W-L-R)*m/maxM;
  const wrap=el('div',{class:'chart scroll'}); const svg=svgEl('svg',{viewBox:`0 0 ${W} ${H}`,style:'min-width:600px'});
  for(let m=0;m<=maxM;m+=60){ svg.append(svgEl('line',{x1:x(m),x2:x(m),y1:T-6,y2:H,stroke:'var(--line)'})); const t=svgEl('text',{x:x(m),y:12,'text-anchor':'middle','font-size':10}); t.textContent=(m/60)+' h'; svg.append(t); }
  const items=[];
  rows.forEach((r,i)=>{
    const y0=T+i*rowH, late=r.mins-r.std, col=late<=0?'var(--ok)':late<=30?'var(--warn)':'var(--bad)';
    const tl=svgEl('text',{x:4,y:y0+15,'font-size':11,fill:'var(--fg)'}); tl.textContent=(state.line==='both'?(r.ln==='can'?'Can · ':'Rack · '):'')+dayName(r.d); svg.append(tl);
    svg.append(svgEl('rect',{x:L,y:y0+4,width:Math.max(2,x(r.mins)-L),height:16,rx:3,fill:col}));
    svg.append(svgEl('line',{x1:x(r.std),x2:x(r.std),y1:y0+1,y2:y0+23,stroke:'var(--muted)','stroke-width':2,'stroke-dasharray':'3 2'}));
    const vt=svgEl('text',{x:x(r.mins)+6,y:y0+16,'font-size':11,fill:'var(--fg)'}); vt.textContent=dur(r.mins); svg.append(vt);
    items.push({x:x(r.mins),y:y0+4,tip:`<b>${LINE_NAME[r.ln]} · ${dayName(r.d)}</b><br>First qual ${hhmm(r.q)}<br>Startup ${dur(r.mins)} (standard ${dur(r.std)})<br>${late<=0?'On time':dur(late)+' over'}`});
  });
  wrap.append(svg); attachHover(wrap,svg,items,W); card.append(wrap);
  card.append(el('div',{class:'note',text:'A late first qual can be planned (a later shift start, a tank not ready) or a problem (palletizer down 11/9). The Run Start run-type section will record the reason.'}));
  p.append(card);
  p.append(el('div',{class:'sqlnote',html:'With SQL: <code>rpt.v_startup</code> takes the first qual per line per day and compares it with the standard for that weekday.'}));
}

/* ===== Downtime tab ===== */
function renderDT(){
  const p=$('#p-dt'); p.replaceChildren(); const D=state.data;
  const card=el('div',{class:'card'}); const runIds=new Set(D.runs.filter(r=>lines().includes(r.line)).map(r=>r.line+r.run+r.id));
  const ev=D.dts.filter(d=>lines().includes(d.line)&&!d.planned&&d.machine!=='Changeover');
  const first=D.runs.length?D.runs[0].day:null;
  card.append(el('h2',{text:'Unplanned downtime by machine (Pareto)'+(first?' · since '+dayName(first):'')}));
  const agg={}; ev.forEach(d=>{ const k=d.line+'|'+d.machine; agg[k]=agg[k]||{line:d.line,machine:d.machine,min:0,n:0}; agg[k].min+=d.min||0; agg[k].n++; });
  const rows=Object.values(agg).sort((a,b)=>b.min-a.min);
  if(!rows.length){ card.append(el('div',{class:'empty',text:'No downtime recorded.'})); p.append(card); return; }
  const totalMin=rows.reduce((s,r)=>s+r.min,0); let cum=0; rows.forEach(r=>{ cum+=r.min; r.cum=cum/totalMin; }); const vital=rows.filter((r,i)=>i===0||rows[i-1].cum<0.8).length;
  card.append(el('div',{class:'sub',html:`<b>Pareto (80/20):</b> the top ${vital} of ${rows.length} machines cause ${fmt(rows[vital-1].cum*100)}% of unplanned downtime (${fmt(totalMin)} min). Fix those first.`}));
  const W=900,rowH=26,L=210,R=150,T=8,H=T+rows.length*rowH+4, max=rows[0].min; const x=m=>L+(W-L-R)*m/max;
  const wrap=el('div',{class:'chart scroll'}); const svg=svgEl('svg',{viewBox:`0 0 ${W} ${H}`,style:'min-width:560px'}); const items=[];
  rows.forEach((r,i)=>{
    const y0=T+i*rowH; const tl=svgEl('text',{x:L-8,y:y0+15,'text-anchor':'end','font-size':11,fill:'var(--fg)'}); tl.textContent=(state.line==='both'?(r.line==='can'?'Can · ':'Rack · '):'')+r.machine; svg.append(tl);
    svg.append(svgEl('rect',{x:L,y:y0+4,width:Math.max(2,x(r.min)-L),height:16,rx:3,fill:'var(--'+r.line+')','fill-opacity':i<vital?1:.35}));
    const vt=svgEl('text',{x:x(r.min)+6,y:y0+16,'font-size':11,fill:'var(--fg)'}); vt.textContent=r.min+' min · '+fmt(r.cum*100)+'%'; svg.append(vt);
    items.push({x:x(r.min)/2+L/2,y:y0+4,tip:`<b>${LINE_NAME[r.line]} · ${r.machine}</b><br>${r.min} min over ${r.n} event${r.n>1?'s':''}<br>Cumulative ${fmt(r.cum*100)}% of downtime`});
  });
  // hover by row: snap on y instead of x
  wrap.append(svg); attachRowHover(wrap,svg,items,W,rowH,T); card.append(wrap);
  p.append(card);
  p.append(el('div',{class:'sqlnote',html:'With SQL: <code>rpt.v_downtime_week</code>, and the predictive-maintenance views (time since last failure, trend by machine) come from the same table.'}));
}
function attachRowHover(wrap,svg,items,W,rowH,T){
  const tip=el('div',{class:'tip'}); wrap.append(tip);
  const H=svg.viewBox.baseVal.height; const hl=svgEl('rect',{x:0,width:W,height:rowH,fill:'currentColor','fill-opacity':'.06',visibility:'hidden'}); svg.prepend(hl);
  const move=ev=>{ const r=svg.getBoundingClientRect(); const cy=('touches' in ev?ev.touches[0].clientY:ev.clientY)-r.top; const yy=cy*H/r.height; let i=Math.floor((yy-T)/rowH); i=Math.max(0,Math.min(items.length-1,i));
    hl.setAttribute('y',T+i*rowH); hl.setAttribute('visibility','visible'); tip.innerHTML=items[i].tip; tip.classList.add('on'); tip.style.left=Math.min(Math.max((items[i].x)*r.width/W,90),r.width-90)+'px'; tip.style.top=((T+i*rowH+2)*r.height/H)+'px'; };
  svg.addEventListener('mousemove',move); svg.addEventListener('touchstart',move,{passive:true}); svg.addEventListener('mouseleave',()=>{tip.classList.remove('on');hl.setAttribute('visibility','hidden');});
}

/* ===== Ticker: downtime on open runs today ===== */
function renderTicker(){
  const D=state.data, today=todayKey(); const open=D.runs.filter(r=>lines().includes(r.line)&&(r.open||r.day===today));
  const parts=[];
  open.forEach(r=>{ const ev=D.dts.filter(d=>d.line===r.line&&d.run===r.id).sort((a,b)=>b.hour-a.hour);
    const tot=ev.reduce((s,d)=>s+(d.min||0),0);
    if(ev.length) parts.push(`${LINE_NAME[r.line]} ${r.batch}: ${tot} min so far · latest ${ev[0].machine} ${ev[0].min} min (hour ${ev[0].hour})`);
    else parts.push(`${LINE_NAME[r.line]} ${r.batch}: no downtime logged`); });
  $('#tickerText').textContent = parts.length ? parts.join('   •   ') : 'No runs today';
}

function render(){
  renderTicker();
  ({live:renderLive,week:renderWeek,oee:renderOEE,co:renderCO,start:renderStart,dt:renderDT,defs:renderDefs})[state.tab]();
}


/* ===== Definitions tab (v2026-11-12) ===== */
const DEFS = [
 ['OEE (Overall Equipment Effectiveness)','Availability × Performance × Quality',
  'How much good product the line made compared with what it could have made in the time it ran. 85% is world class for packaging lines; 60% is typical.',
  'One number that captures stops, slow running and rejects together. Here OEE = line efficiency × Quality, because line efficiency already combines Availability and Performance.'],
 ['TEEP (Total Effective Equipment Performance)','OEE × run hours ÷ 168 hours in a week',
  'How much of the equipment\'s total possible output we actually get, counting every hour of the week.',
  'OEE says how well we run when we run. TEEP says how much more the same equipment could make with more running time, before buying equipment.'],
 ['Availability','(Run time − downtime) ÷ run time',
  'The share of run time the line was actually running.',
  'Points to breakdowns and stops. The Downtime tab shows which machines cost the most.'],
 ['Performance','Line efficiency ÷ Availability (capped at 100%)',
  'How fast the line ran compared with its rated speed while it was running.',
  'Catches slow running and short stops that never get logged as downtime. Near 100% means almost all lost time is logged.'],
 ['Quality','Can Line: net cases ÷ total cases · Racker: final kegs ÷ filler kegs',
  'The share of output that was good on the first pass.',
  'Product on hold or rejected uses the same time and materials as good product.'],
 ['Line efficiency','Output ÷ (rated speed × (run minutes − planned downtime))',
  'The number on the recap email and TV board. Run time is qual to filler end. Capped at 100%; over 100% on short runs means cases in transit were counted after the clock stopped.',
  'The daily scorecard for each run. Weekly by package size is the plain average of its runs; weekly overall is weighted by cases across sizes.'],
 ['Planned vs unplanned downtime','Planned: changeovers, PAA, meetings · Unplanned: breakdowns and slowdowns',
  'Unplanned downtime is logged by machine on each hourly check-in.',
  'Planned time is removed from efficiency so runs are judged fairly; unplanned time is what improvement work targets.'],
 ['Changeover','Next run qual time − previous run filler end (same line, same day)',
  'Standards: Can Line 60 min bright to bright, 90 min hot flush, 60 min size change or tank switch. Racker 45 min beer change, 60 min hot flush, 15 min keg size change.',
  'Every minute over standard is time the line makes nothing. Hot flush vs bright to bright is shown once the Run Start records the run type.'],
 ['Startup','5:00 AM → first qual of the day',
  'Running-by standard: Can Line 7:15 Tuesday to Friday, 7:30 Monday; Racker 8:00.',
  'A late start pushes every run after it and is the most common cause of carryover.'],
 ['Downtime Pareto','Machines sorted by unplanned minutes, with a running total %',
  'The highlighted machines are the "vital few" that add up to about 80% of the lost time.',
  'Shows where a fix pays back first, instead of spreading effort across every machine.'],
 ['Plan vs actual','Frozen weekly plan compared with what each run actually made',
  'The plan is fixed at the start of the week so it does not move as the week runs. Actual shows each run\'s count.',
  'Shows early whether the week will finish, so the schedule can change before the hard stop.'],
 ['Carryover','Cases or kegs a day cannot finish before the hard stop or CIP, rolled to the next day',
  'Comes from the plan for the day and the line\'s rated speed.',
  'Early warning to adjust the schedule, start earlier or move runs before the week starts.']
];
function renderDefs(){
  const p = $('#p-defs'); p.innerHTML = '';
  p.append(el('div',{class:'card'},[el('h2',{text:'Definitions'}),
    el('div',{class:'sub',text:'How every number on this page is calculated. All figures come from the tablet forms; nothing is typed in by hand. Same definitions as the Packaging Performance Dashboard.'})]));
  const g = el('div',{class:'grid'});
  DEFS.forEach(([name, formula, what, why]) => g.append(el('div',{class:'card'},[
    el('h2',{text:name}),
    el('div',{class:'mono',text:formula}),
    el('div',{class:'sub',text:what}),
    el('div',{class:'sub',html:'<b>Why it matters:</b> '}),
  ])));
  g.querySelectorAll('.card').forEach((c,i) => c.lastChild.append(document.createTextNode(DEFS[i][3])));
  p.append(g);
}

document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{ state.line=b.dataset.line; document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b)); render(); }));
